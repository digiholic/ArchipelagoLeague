<header>
    <script src="js/jquery.min.js"></script>
    <script type="module" src="index.js"></script>
    <link rel="stylesheet" href="css/client.css">
</header>

<body>
    <div id="stream-viewer">
        <div id="left-streams" class="streams">

            <!--
            <div id="name-plate-2" class="stream-name stream-left stream-high">Player Name</div>
            <div id="name-plate-1" class="stream-name stream-right stream-mid-high">Player Name</div>
            <div id="name-plate-3" class="stream-name stream-left stream-mid-low">Player Name</div>
            -->

            <div id="left-stream-1" class="stream stream-equal stream-top stream-left"></div>
            <div id="left-stream-2" class="stream stream-equal stream-center stream-right"></div>
            <div id="left-stream-3" class="stream stream-equal stream-bottom stream-left"></div>
        </div>
        <div id="stream-divider"></div>
        <div id="right-streams" class="streams">
            <!--
            <div id="name-plate-2" class="stream-name stream-right stream-high">Player Name</div>
            <div id="name-plate-1" class="stream-name stream-left stream-mid-high">Player Name</div>
            <div id="name-plate-3" class="stream-name stream-right stream-mid-low">Player Name</div>
            -->
            <div id="right-stream-1" class="stream stream-equal stream-top stream-right"></div>
            <div id="right-stream-2" class="stream stream-equal stream-center stream-left"></div>
            <div id="right-stream-3" class="stream stream-equal stream-bottom stream-right"></div>

        </div>
    </div>
    <div id="spacer"></div>
    <div id="multi-tracker">
        <div id="left-team-banner" class="hex-bg">
            <div id="left-connections" class="connection-panel">
                <label for="left-server-address">Address:</label>
                <input type="text" id="left-server-address">
                <label for="left-server-slot">Slot:</label>
                <input type="text" id="left-server-slot">
                <label for="left-server-passwd">Password (Blank if none):</label>
                <input type="password" id="left-server-passwd">
                <button id="left-connect-button">Connect</button>
            </div>
            <div id="left-slots" style="display:none">
                <div class="team-header left">
                    <h1 id="team-header-left">Blue Team</h1>
                </div>
            </div>
        </div>
        <div id="client-area">
            <div id="text-client"></div>
        </div>
        <div id="right-team-banner" class="hex-bg">
            <div id="right-connections" class="connection-panel">
                <label for="right-server-address">Address:</label>
                <input type="text" id="right-server-address">
                <label for="right-server-slot">Slot:</label>
                <input type="text" id="right-server-slot">
                <label for="right-server-passwd">Password (Blank if none):</label>
                <input type="password" id="right-server-passwd">
                <button id="right-connect-button">Connect</button>
            </div>
            <div id="right-slots" style="display:none">
                <div class="team-header right">
                    <h1 id="team-header-right">Red Team</h1>
                </div>
            </div>
        </div>
    </div>
</body>
<footer>
    <fieldset id="left-team-settings">
        <legend>Left Team Settings</legend>

        <div>
            <label for="left-team-name">Left Team Name:</label>
            <input type="text" id="left-team-name">
            <label for="left-tracker-url">Left Team Tracker URL:</label>
            <input type="text" id="left-tracker-url">
        </div>
        <div>
            <label for="left-player-1-name">Player 1 Name:</label>
            <input type="text" id="left-player-1-name">
            <label for="left-player-1-stream">Player 1 Stream Link:</label>
            <input type="text" id="left-player-1-stream">
        </div>
        <div>
            <label for="left-player-2-name">Player 2 Name:</label>
            <input type="text" id="left-player-2-name">
            <label for="left-player-2-stream">Player 2 Stream Link:</label>
            <input type="text" id="left-player-2-stream">
        </div>
        <div>
            <label for="left-player-3-name">Player 3 Name:</label>
            <input type="text" id="left-player-3-name">
            <label for="left-player-3-stream">Player 3 Stream Link:</label>
            <input type="text" id="left-player-3-stream">
        </div>
    </fieldset>
    <fieldset id="right-team-settings">
        <legend>Right Team Settings</legend>

        <div>
            <label for="right-team-name">Right Team Name:</label>
            <input type="text" id="right-team-name">
            <label for="right-tracker-url">Right Team Tracker URL:</label>
            <input type="text" id="right-tracker-url">
        </div>
        <div>
            <label for="right-player-1-name">Player 1 Name:</label>
            <input type="text" id="right-player-1-name">
            <label for="right-player-1-stream">Player 1 Twitch:</label>
            <input type="text" id="right-player-1-stream">
        </div>
        <div>
            <label for="right-player-2-name">Player 2 Name:</label>
            <input type="text" id="right-player-2-name">
            <label for="right-player-2-stream">Player 2 Twitch:</label>
            <input type="text" id="right-player-2-stream">
        </div>
        <div>
            <label for="right-player-3-name">Player 3 Name:</label>
            <input type="text" id="right-player-3-name">
            <label for="right-player-3-stream">Player 3 Twitch:</label>
            <input type="text" id="right-player-3-stream">
        </div>
    </fieldset>
    <button id="copy-url">Copy Browser Source URL</button>
</footer>
