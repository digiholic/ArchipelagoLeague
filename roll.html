<header>
    <script src="js/jquery.min.js"></script>
    <script type="module" src="js/roll.js"></script>
    <link rel="stylesheet" href="css/client.css">
</header>

<body>
    <div>
        <h1 id="game-1">Game #1</h1>
        <h1 id="game-2">Game #2</h1>
        <h1 id="game-3">Game #3</h1>
        <div>
            <button id="roll">Roll em!</button>
        </div>
        <div>
            <span>
                <input type="radio" id="short" name="list-type" value="short" checked>
                <label for="short">Short List</label>
            </span>
            <span>
                <input type="radio" id="extended" name="list-type" value="extended">
                <label for="extended">Extended List</label>
            </span>
        </div>
        <div>
            <button id="good-button" style="display:none">That's good!</button>
            <p id="good-count"></p>
        </div>
    </div>
</body>
